[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "videodownloader"
dynamic = ["version"]
description = "A maintainable Windows GUI and CLI frontend for yt-dlp"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Private" }
authors = [{ name = "spell" }]
dependencies = []

[project.optional-dependencies]
browser = [
  "selenium>=4.40",
]
gui = [
  "PySide6>=6.8",
]
packaging = [
  "PyInstaller>=6.16",
]
dev = [
  "pytest>=8.4",
  "pytest-cov>=6.2",
  "ruff>=0.12",
]

[project.scripts]
video-downloader = "videodownloader.app:main"
video-downloader-gui = "videodownloader.gui:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.dynamic]
version = { attr = "videodownloader.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -p no:cacheprovider"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
